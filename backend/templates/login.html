<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Ingresar - Sirio Arabia</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800&family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <link href="{{ url_for('static', filename='vendor/bootstrap/5.3.3/css/bootstrap.min.css') }}" rel="stylesheet">
    <link href="{{ url_for('static', filename='vendor/bootstrap-icons/1.11.3/bootstrap-icons.min.css') }}" rel="stylesheet">
    <link href="{{ url_for('static', filename='css/app.css') }}" rel="stylesheet">
    <style>
      body{min-height:100vh; background: linear-gradient(135deg, #0f4c5c 0%, #0b3240 100%);} /* azul/verde petróleo */
      .login-card{max-width: 980px; border:0; border-radius: 1rem; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,.25)}
      .brand-side{background: linear-gradient(180deg, rgba(11,50,64,.65), rgba(11,50,64,.55));}
      .brand-title{color:#ffffff; text-shadow: 0 2px 8px rgba(0,0,0,.35)}
      .accent{color: var(--teal)}
      .form-title{color:#0f766e; font-family:'Playfair Display','Poppins',serif; font-weight:800; font-size:1.9rem; letter-spacing:.2px}
      .form-control:focus{box-shadow: 0 0 0 .2rem rgba(15,118,110,.25); border-color:#0f766e}
      .btn-teal{background:#0f766e; border-color:#0f766e}
      .btn-teal:hover{filter:brightness(.95)}
      .placeholder-box{width: 10rem; height: 10rem; border-radius: 50%; border: 4px solid rgba(255,255,255,.95); background: rgba(255,255,255,.12); display:flex; align-items:center; justify-content:center; color:#ffffff; font-weight:700; text-shadow: 0 1px 6px rgba(0,0,0,.35)}
      .brand-side p, .brand-side .small{color:#f2fbff !important; text-shadow: 0 1px 6px rgba(0,0,0,.25)}
      .divider{display:flex; align-items:center; gap:.75rem; color:#f2fbff; opacity:.95}
      .divider::before, .divider::after{content:""; flex:1; height:1px; background: rgba(242,251,255,.8)}
    </style>
  </head>
  <body class="d-flex align-items-center py-4 py-md-5">
    <div class="container">
      <div class="card login-card mx-auto">
        <div class="row g-0">
          <!-- Brand/Image side -->
          <div class="col-md-6 brand-side d-flex flex-column align-items-center justify-content-center p-4 p-md-5 text-center">
            <div class="placeholder-box mb-4">
              <!-- Dejar espacio para la imagen futura -->
              <span>Logo</span>
            </div>
            <h2 class="brand-title fw-bold mb-1">Sirio Arabia</h2>
            <p class="mb-0">Representaciones</p>
            <div class="mt-4 small w-100 px-4">
              <div class="divider">Acceso exclusivo</div>
            </div>
          </div>
          <!-- Form side -->
          <div class="col-md-6 bg-white p-4 p-md-5">
            <h1 class="h4 form-title mb-1">Iniciar sesión</h1>
            <p class="text-secondary mb-4">Ingresá tus credenciales para continuar</p>

            {% if error %}
            <div class="alert alert-danger py-2">Usuario o contraseña incorrectos</div>
            {% endif %}

            <form method="post" action="{{ url_for('auth.login', next=request.args.get('next')) }}">
              <div class="mb-3">
                <label for="username" class="form-label">Usuario</label>
                <div class="input-group">
                  <span class="input-group-text"><i class="bi bi-person"></i></span>
                  <input type="text" class="form-control" id="username" name="username" placeholder="sirio" required autofocus>
                </div>
              </div>
              <div class="mb-3">
                <label for="password" class="form-label">Contraseña</label>
                <div class="input-group">
                  <span class="input-group-text"><i class="bi bi-lock"></i></span>
                  <input type="password" class="form-control" id="password" name="password" placeholder="••••••••" required>
                </div>
              </div>
              <div class="d-grid">
                <button type="submit" class="btn btn-teal text-white fw-semibold">Ingresar</button>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>

    <script src="{{ url_for('static', filename='vendor/bootstrap/5.3.3/js/bootstrap.bundle.min.js') }}"></script>
  </body>
</html>
