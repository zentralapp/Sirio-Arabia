{% extends 'layout.html' %}
{% block content %}
<div class="d-flex flex-column flex-sm-row justify-content-between align-items-stretch align-items-sm-center gap-2 mb-3">
  <h1 class="h4 mb-0">Calendario</h1>
  <div class="d-flex align-items-center gap-2">
    <div class="btn-group w-100" role="group" aria-label="Vistas de calendario">
      <button type="button" class="btn btn-outline-secondary btn-sm" data-view="dayGridMonth">Mes</button>
      <button type="button" class="btn btn-outline-secondary btn-sm" data-view="listWeek">Lista</button>
    </div>
  </div>
</div>
<style>
  .fc .fc-toolbar-title { font-size: 1.2rem; color:#0f766e; font-weight:600; text-transform: capitalize; }
  .fc .fc-button-primary { background:#0f766e; border-color:#0f766e; }
  .fc .fc-button-primary:disabled { background:#0f766e; border-color:#0f766e; opacity:.65 }
  .fc .fc-daygrid-dot-event .fc-event-title { font-weight: 500; }
  .fc-theme-standard td, .fc-theme-standard th { border-color: #e5e7eb; }
  .fc .fc-day-today { background: #ecfeff; }
  /* Colores de letras y números en encabezados y días */
  .fc .fc-col-header-cell-cushion { color:#0f766e; font-weight:600; }
  .fc .fc-daygrid-day-number { color:#0f766e; font-weight:600; }
  /* Ocultar número de día solo en vista Mes para evitar superposición */
  .fc-view-dayGridMonth .fc-daygrid-day-number { display: none; }
  .fc .fc-daygrid-day { cursor: pointer; }
  /* Lista: ocultar columna de hora para no mostrar 'all-day' */
  .fc .fc-list-event-time { display: none; }
  .fc .fc-list-event-title { padding-left: 0; }
  .calendar-card { border-radius:.75rem; box-shadow:0 8px 24px rgba(0,0,0,.08); border:1px solid #e5e7eb; overflow:hidden; }

  /* DOBLE CODIFICACION DE COLOR: dos canales visuales independientes.
     - fondo/borde del evento -> TIPO (entrega / cobranza / cumpleanos)
     - este punto             -> SEVERIDAD (derivada de la fuente unica)
     El punto lleva anillo blanco para que se lea sobre cualquier fondo. */
  .sirio-ev { display:flex; align-items:center; gap:.35rem; min-width:0; }
  .sirio-ev-title { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  /* El punto va sobre un "plato" BLANCO fijo. Sin el plato, el canal de
     severidad se pierde cuando su tono coincide con el fondo del tipo
     (ej: punto ambar "media" sobre el ambar de Cobranza): se leia como un
     anillo vacio. Con el plato, la severidad siempre se lee contra blanco,
     independiente del color del tipo. */
  .sirio-sev-dot {
    flex: 0 0 auto;
    width:.85rem; height:.85rem; border-radius:50%;
    background:#fff;
    display:inline-flex; align-items:center; justify-content:center;
    box-shadow:0 0 0 1px rgba(15,23,42,.35);
  }
  .sirio-sev-dot > i { display:block; width:.45rem; height:.45rem; border-radius:50%; }

  .sirio-leyenda { font-size:.78rem; color:#475569; }
  .sirio-leyenda-tipo { display:inline-block; width:.7rem; height:.7rem; border-radius:.2rem; }

  @media (max-width: 575.98px) {
    .fc .fc-toolbar { flex-wrap: wrap; gap: .5rem; }
    .fc .fc-toolbar-title { font-size: 1.05rem; }
    .fc .fc-button { padding: .35rem .55rem; font-size: .9rem; }
  }
</style>
<div class="card calendar-card">
  <div class="card-body p-0">
    <div id="sirioCalendar"></div>
  </div>
</div>

<div class="sirio-leyenda d-flex flex-wrap align-items-center gap-3 mt-2">
  <span class="fw-semibold">Tipo (fondo):</span>
  <span class="d-inline-flex align-items-center gap-1"><span class="sirio-leyenda-tipo" style="background:#0ea5a3"></span> Entrega</span>
  <span class="d-inline-flex align-items-center gap-1"><span class="sirio-leyenda-tipo" style="background:#f59e0b"></span> Cobranza</span>
  <span class="d-inline-flex align-items-center gap-1"><span class="sirio-leyenda-tipo" style="background:#ec4899"></span> Cumpleaños</span>
  <span class="fw-semibold ms-sm-3">Severidad (punto):</span>
  <span class="d-inline-flex align-items-center gap-1"><span class="sirio-sev-dot"><i style="background:#7f1d1d"></i></span> Crítica (atraso &ge; 30 d)</span>
  <span class="d-inline-flex align-items-center gap-1"><span class="sirio-sev-dot"><i style="background:#dc2626"></i></span> Alta (atrasado)</span>
  <span class="d-inline-flex align-items-center gap-1"><span class="sirio-sev-dot"><i style="background:#d97706"></i></span> Media (a cobrar)</span>
  <span class="d-inline-flex align-items-center gap-1"><span class="sirio-sev-dot"><i style="background:#0284c7"></i></span> Baja (en camino)</span>
  <span class="d-inline-flex align-items-center gap-1"><span class="sirio-sev-dot"><i style="background:#94a3b8"></i></span> Sin acción</span>
</div>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/main.min.css" />
<script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.js"></script>
<script>
(function(){
  var calendarEl = document.getElementById('sirioCalendar');
  if (!calendarEl || !window.FullCalendar) return;
  // "Hoy" del NEGOCIO (hora de Argentina), calculado por el backend con la
  // FUENTE UNICA DE VERDAD (backend/models.py -> hoy_negocio()). El JS NUNCA
  // usa new Date() para decidir estado ni para saber que dia es hoy: si el
  // navegador esta en otro huso veria un dia distinto al del servidor.
  var HOY_NEGOCIO_ISO = '{{ now_date|fecha_iso }}';
  if (window.SirioFechas && HOY_NEGOCIO_ISO) {
    window.SirioFechas.setHoyNegocio(HOY_NEGOCIO_ISO);
  }
  var initialDate = HOY_NEGOCIO_ISO || '{{ today }}';

  // Color del punto por SEVERIDAD. La severidad la calcula el backend con la
  // fuente unica; el JS solo la pinta (no la deriva).
  var SEVERIDAD_COLOR = {
    critica: '#7f1d1d',
    alta:    '#dc2626',
    media:   '#d97706',
    baja:    '#0284c7',
    ninguna: '#94a3b8',
    info:    '#a855f7'
  };
  var SEVERIDAD_LABEL = {
    critica: 'Critica',
    alta:    'Alta',
    media:   'Media',
    baja:    'Baja',
    ninguna: 'Sin accion',
    info:    'Informativo'
  };

  // Antes: `isMobile = window.innerWidth <= 575` evaluado UNA sola vez al
  // cargar. Quedaba congelado: al rotar el dispositivo o redimensionar la
  // ventana la toolbar mantenia la config del tamano inicial. Se usa matchMedia
  // con el MISMO breakpoint que el @media de arriba (575.98px) para tener una
  // sola fuente de verdad, y su evento 'change' dispara solo al CRUZAR el
  // breakpoint (no en cada pixel de resize), asi que no hace falta debounce.
  var mqMobile = null;
  try { mqMobile = window.matchMedia('(max-width: 575.98px)'); } catch(e) { mqMobile = null; }
  var isMobile = !!(mqMobile && mqMobile.matches);
  function toolbarPara(mobile){
    return {
      left: mobile ? 'prev,next' : 'prev,next today',
      center: 'title',
      right: mobile ? 'today' : ''
    };
  }
  var cal = new FullCalendar.Calendar(calendarEl, {
    initialView: 'dayGridMonth',
    initialDate: initialDate,
    // 'now' manda en el resaltado del dia de hoy y en el boton "Hoy".
    // Sin esto FullCalendar usa el reloj del navegador.
    now: initialDate || undefined,
    locale: 'es',
    firstDay: 1,
    buttonText: { today: '↻ Hoy', month: 'Mes', list: 'Lista' },
    noEventsText: 'Sin eventos para mostrar',
    headerToolbar: toolbarPara(isMobile),
    height: 'auto',
    contentHeight: isMobile ? 560 : 720,
    expandRows: true,
    themeSystem: 'standard',
    eventDisplay: 'block',
    displayEventTime: false,
    editable: false,
    selectable: false,
    nowIndicator: true,
    allDaySlot: false,
    dayMaxEventRows: true,
    moreLinkClick: 'popover',
    moreLinkText: function(args){ return '+ ver más'; },
    dayHeaderContent: function(arg){
      var map = ['Dom','Lun','Mar','Mier','Jue','Vie','Sab'];
      return map[arg.date.getDay()];
    },
    navLinks: true,
    dateClick: function(info){
      if (cal) { cal.changeView('listDay', info.dateStr); }
    },
    dayCellDidMount: function(arg){
      // Antes: arg.date.toISOString().slice(0,10). Eso NO estaba roto en
      // Argentina (UTC-3: medianoche local = 03:00Z, mismo dia), pero se
      // rompe en cualquier huso con offset POSITIVO, donde la medianoche
      // local cae el dia anterior en UTC. Se unifica por consistencia y para
      // que no dependa del huso del navegador.
      var el = arg.el;
      if (!el) return;
      el.setAttribute('role','button');
      el.setAttribute('tabindex','0');
      el.addEventListener('click', function(){ if (cal) cal.changeView('listDay', window.SirioFechas.toIso(arg.date)); });
      el.addEventListener('keydown', function(ev){ if(ev.key==='Enter' || ev.key===' '){ ev.preventDefault(); if (cal) cal.changeView('listDay', window.SirioFechas.toIso(arg.date)); }});
    },
    events: function(info, success, failure){
      var url = "{{ url_for('main.api_calendario_events') }}" + '?start=' + encodeURIComponent(info.startStr) + '&end=' + encodeURIComponent(info.endStr);
      fetch(url, { credentials: 'same-origin' })
        .then(function(r){ return r.json(); })
        .then(function(data){ success(data || []); })
        .catch(function(err){ failure(err); });
    },
    // DOBLE CODIFICACION: el fondo/borde ya viene del backend por TIPO
    // (event.color). Aca se agrega el segundo canal: un punto cuyo color es la
    // SEVERIDAD. Son dos ejes independientes, no se mezclan.
    eventContent: function(arg){
      var props = arg.event.extendedProps || {};
      var sev = props.severidad || 'ninguna';
      var wrap = document.createElement('div');
      wrap.className = 'sirio-ev';

      var dot = document.createElement('span');
      dot.className = 'sirio-sev-dot';
      dot.setAttribute('aria-hidden', 'true');
      var nucleo = document.createElement('i');
      nucleo.style.backgroundColor = SEVERIDAD_COLOR[sev] || SEVERIDAD_COLOR.ninguna;
      dot.appendChild(nucleo);
      wrap.appendChild(dot);

      // El color no puede ser el UNICO canal: texto solo para lectores de
      // pantalla con tipo + severidad + estado.
      var sr = document.createElement('span');
      sr.className = 'visually-hidden';
      sr.textContent = (props.tipo || '') + ', severidad ' +
        (SEVERIDAD_LABEL[sev] || sev) +
        (props.estado ? ', estado ' + props.estado : '') + '. ';
      wrap.appendChild(sr);

      var txt = document.createElement('span');
      txt.className = 'sirio-ev-title';
      txt.textContent = arg.event.title || '';
      wrap.appendChild(txt);

      return { domNodes: [wrap] };
    },
    eventDidMount: function(info){
      // Tooltip: titulo + estado/severidad/atraso derivados de la fuente unica
      var props = info.event.extendedProps || {};
      var partes = [info.event.title || ''];
      if (props.estado) partes.push('Estado: ' + props.estado);
      var sev = props.severidad;
      if (sev) partes.push('Severidad: ' + (SEVERIDAD_LABEL[sev] || sev));
      if (props.diasAtraso) partes.push('Atraso: ' + props.diasAtraso + ' dias');
      if (props.vencimiento) partes.push('Vence: ' + (window.SirioFechas ? window.SirioFechas.format(props.vencimiento, props.vencimiento) : props.vencimiento));
      info.el.setAttribute('title', partes.join(' | '));
    }
  });
  cal.render();

  // Reconfigura la toolbar cuando se cruza el breakpoint (rotacion / resize).
  function aplicarModo(mobile){
    if (mobile === isMobile) return;
    isMobile = mobile;
    cal.setOption('headerToolbar', toolbarPara(isMobile));
    cal.setOption('contentHeight', isMobile ? 560 : 720);
  }
  if (mqMobile){
    if (mqMobile.addEventListener) {
      mqMobile.addEventListener('change', function(ev){ aplicarModo(!!ev.matches); });
    } else if (mqMobile.addListener) {
      // Safari < 14
      mqMobile.addListener(function(ev){ aplicarModo(!!ev.matches); });
    }
  }

  // Vista switcher
  document.querySelectorAll('[data-view]').forEach(function(btn){
    btn.addEventListener('click', function(){ var v = btn.getAttribute('data-view'); if(v){ cal.changeView(v); } });
  });
})();
</script>
{% endblock %}
