{# ════════════════════════════════════════════════════════════════════════
   BLINDAJE MOBILE COMPARTIDO — piso tactil de 44px y anti-zoom de 16px.
   ────────────────────────────────────────────────────────────────────────
   Vivia suelto adentro del <style> de layout.html. Se saco a un parcial
   porque /login NO extiende layout.html y se quedaba afuera de todo el
   blindaje, siendo la PRIMERA pantalla que ve el cliente.

   NO se hizo que login.html extienda layout.html: layout trae navbar,
   sidebar y el menu de 14 items, y un login con la navegacion completa es
   peor que el problema que arregla.

   Tampoco alcanzaba con que /login linkee app.css: ya lo linkea
   (login.html:12). El blindaje NO esta en app.css justamente porque app.css
   se carga ANTES del <style> del layout y pierde todos los empates de
   especificidad (las media queries no aportan especificidad). Por eso esto
   tiene que seguir viviendo en un <style> del documento, y por eso se
   comparte por include y no por hoja.

   COMO SE INCLUYE: adentro de un <style> que vaya DESPUES del <link> de
   app.css. Hoy lo incluyen layout.html y login.html. Este archivo es la
   UNICA copia: no duplicar estas reglas en ninguna vista.
   ════════════════════════════════════════════════════════════════════════ #}

      /* ═══════════════════════════════════════════════════════════════════════
         T1-A — PISO TÁCTIL (44px) Y ANTI-ZOOM DE iOS (16px) HASTA 991.98px.
         NO BORRAR. NO FUSIONAR con el bloque `max-width:767.98px` de arriba.
         ───────────────────────────────────────────────────────────────────────
         AGUJERO MEDIDO QUE TAPA: el único lugar de toda la app donde existía el
         piso de 44px y el anti-zoom de 16px era la regla
         `.btn,.form-control,.form-select` del bloque `max-width:767.98px` de
         arriba. De 768px para arriba no había NADA, y la auditoría de 23 rutas
         × 3 viewports lo mostró como un salto brutal en la cuenta de inputs con
         `font-size` < 16px (los que disparan el zoom automático de iOS Safari):
             360px -> 48     390px -> 48     800px -> 220
         O sea: tablet vertical, tablet Android y teléfono en horizontal (la
         banda 768-991.98px) quedaban sin blindaje, que es justo la franja donde
         el dedo sigue siendo el puntero.

         POR QUÉ ES UN BLOQUE HERMANO Y NO SE SUBIÓ EL TECHO DEL DE 767.98px:
         ese bloque también contiene `.table{font-size:13px}` y el padding
         compacto de celdas. Subirlos a 991.98px achicaría las tablas en tablet,
         que hoy se ven bien. Sería una regresión, no un arreglo. Acá va SÓLO el
         blindaje táctil y tipográfico, nada de tipografía de tabla.

         POR QUÉ VIVE EN layout.html Y NO EN app.css: `app.css` se linkea en el
         `<head>` ANTES de este `<style>`, así que pierde todos los empates de
         especificidad contra él (las media queries no aportan especificidad).
         Puesto acá, gana contra los `.form-control{font-size:.92rem}` de
         `app.css` sin necesidad de un solo `!important`.                       */
      @media (max-width: 991.98px) {
        .btn, .form-control, .form-select { min-height: 44px; font-size: 16px; }

        /* T1-C — EL ANCHO DE LOS BOTONES ÍCONO-ONLY.
           CAUSA: el `min-height:44px` de la línea de arriba les estira el alto
           y NADA les sostiene el ancho, así que quedan óvalos verticales.
           Medido a 390px antes del fix: 144 botones con ancho < 44px y alto
           >= 40px en 22 rutas; el peor, `/notificaciones`, con 59 botones
           `rounded-circle` renderizando a 19.8 x 44px.

           POR QUÉ NO SE PONE `min-width:44px` EN TODO `.btn` — PROBADO Y
           REVERTIDO. Para un flex item el default es `min-width:auto`, que es
           JUSTO lo que le impide encogerse por debajo de su min-content.
           Declarar `min-width:44px` REEMPLAZA esa protección: el botón deja de
           tener piso de min-content y el navegador lo puede achicar hasta 44.
           Medido a 800px en /estado-clientes: los 50 botones "Guardar" (que
           viven en un `form.d-inline-flex`) pasaron de 85px en una línea a 61px
           partidos en DOS líneas. Un botón con texto NO necesita este piso: ya
           es más ancho que 44px por su propio contenido.

           Se apunta sólo a los que no tienen texto que proteger: `:has()` con
           `:only-child` da "el único hijo elemento es un ícono". `:has()` es
           Safari 15.4+ / Chrome 105+; si un navegador viejo lo ignora, la regla
           entera se descarta y volvemos al estado previo, que es degradación
           limpia. Se suma `.rounded-circle` porque un botón redondo con el alto
           estirado y el ancho colapsado es un óvalo aunque tenga texto.        */
        .btn:has(> i.bi:only-child),
        .btn.rounded-circle { min-width: 44px; }

        /* T1-D — LOS TRES TARGETS DE LA BARRA SUPERIOR.
           Fallan en LAS 22 PÁGINAS AUTENTICADAS, o sea que un solo arreglo de
           tres reglas se lleva 110 hallazgos. Ninguno de los tres es un `.btn`,
           por eso el piso táctil de arriba nunca los tocó. Medido a 390px:
             .navbar-brand            220.7 x 25.8px  -> falta alto
             .navbar-toggler           45.0 x 32.3px  -> falta alto
             campana de notificaciones 30.8 x 44px    -> falta ancho, y el
                                                         contenido partía en
                                                         varias líneas.
           La campana lleva un `.badge` en `position:absolute` que infla el
           contenido del ancla: con `inline-flex` + `line-height:1` el badge
           sale del flujo de verdad y el ancla vuelve a medir lo que mide el
           ícono. Se selecciona por su `aria-label` a propósito: es el mismo
           gancho que ya usa el JS de este archivo para actualizar el contador,
           así que no hace falta tocar el markup. */
        .navbar-brand { min-height: 44px; }
        .navbar-toggler { min-width: 44px; min-height: 44px; }
        a[aria-label="Centro de notificaciones"] {
          display: inline-flex;
          align-items: center;
          justify-content: center;
          min-width: 44px;
          min-height: 44px;
          line-height: 1;
          white-space: nowrap;
        }
      }
